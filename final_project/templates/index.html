<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Emotion Detection</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
    <script src="{{ url_for('static', filename='mywebscript.js') }}"></script>
    <style>
        .center-heading {
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container py-4">
        <div class="card mx-auto" style="max-width: 800px;">
            <div class="card-body">
                <h1 class="center-heading">NLP - Emotion Detection</h1>
                <div class="form-group py-3">
                    <label class="form-label">Please enter the text to be analyzed</label>
                    <textarea class="form-control" id="textToAnalyze" rows="4"></textarea>
                </div>
                <div class="py-2">
                    <button onclick="RunSentimentAnalysis()" class="btn btn-secondary">Run Emotion Detection</button>
                </div>
                <div class="py-3">
                    <h2>Result of Emotion Detection</h2>
                    <pre id="system_response" class="bg-light p-3" style="white-space: pre-wrap;"></pre>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
